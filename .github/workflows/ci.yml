# SPDX-License-Identifier: MPL-2.0
name: CI

# This repository ships data, not a build: CI validates the YAML against the schemas and nothing is
# versioned or released from here. Workflows from forks wait for a maintainer to approve them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate ingredients, mappings and relationships
        run: python scripts/validate.py

  # The one check branch protection requires.
  ci-success:
    name: ci-success
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
